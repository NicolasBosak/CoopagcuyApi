name: Seguridad

# En Pull Request los hallazgos bloquean; en push a main o develop solo
# informan, para no dejar al proyecto sin poder desplegar un arreglo urgente.
# Excepción: el escaneo de secretos bloquea siempre (ver más abajo).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 7 * * 1"   # lunes 07:00 UTC
  workflow_dispatch:

jobs:
  escaneo:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Secretos commiteados ────────────────────────────────────────────
      # Primer paso del job, y a propósito: es el único escaneo "bloquea
      # siempre" (una cadena de conexión de Neon o una Jwt:Key en el
      # historial es una emergencia, no un aviso), así que no puede quedar
      # detrás de un paso que puede fallar. GitHub Actions salta el resto de
      # los pasos de un job en cuanto uno falla, a menos que ese paso
      # siguiente lleve su propio `if:` — y antes de este cambio, el gate de
      # secretos vivía DESPUÉS de los dos escaneos de dependencias, así que
      # un HIGH/CRITICAL en el paso "Trivy fs — API" (que sí bloquea en PR)
      # hacía que el escaneo de secretos ni siquiera se ejecutara: un PR con
      # una CVE y una clave commiteada a la vez pasaba el gate de secretos en
      # silencio. Poniéndolo primero, el escaneo de secretos corre siempre
      # que el checkout tenga éxito, sin depender de `if:` en absoluto. Todos
      # los pasos que vienen después de este sí lo necesitan (`if: always()`)
      # para no heredar el mismo problema si ESTE paso falla.
      - name: Trivy sobre secretos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

      # ── Dependencias vulnerables (NuGet, vía Trivy) ────────────────────
      # Se bloquea por lo que llega a producción, no por herramientas de
      # desarrollo: las dependencias de pruebas nunca se sirven al usuario, y
      # bloquear por ellas solo enseña al equipo a ignorar el check (mismo
      # razonamiento que la auditoría nativa de NuGet más abajo, y que el
      # `pnpm audit --prod` que tendrá el front). Por eso este escaneo se
      # divide en dos pasos con `scan-ref` apuntando cada uno a un
      # packages.lock.json distinto (Tarea 8), en vez de escanear "." con
      # `--skip-dirs tests`: acotar el archivo exacto es más explícito sobre
      # qué se está bloqueando y no depende de mantener sincronizado un
      # nombre de carpeta en un flag aparte. Verificado con el binario de
      # Trivy que usa la acción por debajo: ambos mecanismos (scan-ref a un
      # archivo, y "." + --skip-dirs) funcionan igual de bien; se documenta
      # la elección, no una limitación.
      #
      # `if: always()`: si el escaneo de secretos de arriba falla, este paso
      # tiene que correr igual — es el único modo de que un hallazgo de
      # dependencias no quede oculto detrás de un hallazgo de secretos.
      - name: Trivy sobre el sistema de archivos — API (bloquea)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: packages.lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-api.sarif
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      # Mismo árbol de dependencias que ve `dotnet list` sobre el proyecto de
      # pruebas: se escanea para tener visibilidad, pero nunca bloquea
      # (exit-code fijo en "0", sin condicionar al evento). Las 3 CVE que
      # aparecen hoy aquí quedan como deuda registrada en el reporte de esta
      # tarea, no se arreglan en este cambio.
      - name: Trivy sobre el sistema de archivos — pruebas (informativo)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: tests/CoopagcuyApi.Tests/packages.lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-tests.sarif
          exit-code: "0"

      # ── Malas prácticas del Dockerfile ──────────────────────────────────
      # Puramente informativo: no bloquea en ningún evento.
      - name: Trivy sobre configuración
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"

      # Se suben siempre, también si algún paso de fs falló: el reporte es
      # justamente lo que hace falta para diagnosticar. El repositorio es
      # público, así que subir SARIF a la pestaña Security no tiene coste.
      # Ahora hay dos escaneos de sistema de archivos (API y pruebas), así
      # que cada uno sube con su propia `category`: si compartieran una, el
      # segundo upload-sarif pisaría al primero en la pestaña Security y se
      # perdería la mitad de la información.
      - name: Publicar hallazgos — API
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-api.sarif
          category: trivy-fs-api

      - name: Publicar hallazgos — pruebas
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-tests.sarif
          category: trivy-fs-tests

      # ── Segunda opinión con la herramienta nativa de .NET ───────────────
      # Nada de CoopagcuyApi.slnx: ese formato exige SDK 9.0.200+ y aquí se
      # usa 8.0.x, falla con MSB4068 (ya tropezamos con esto en las Tareas 3,
      # 7, 8 y 10). Se usan rutas de proyecto explícitas.
      #
      # `if: always()`: este paso es un prerrequisito de las dos auditorías
      # NuGet de más abajo, que ya llevaban `if: always()` (o lo necesitan)
      # para no depender de que los Trivy de arriba salieran limpios. Sin
      # este `if:` aquí, un Trivy fallido saltaba este setup-dotnet, y la
      # auditoría NuGet corría igual (por su propio `if: always()`) pero
      # contra el SDK que trajera el runner por defecto en vez del 8.0.x
      # fijado — silenciosamente, sin fallar, solo con resultados que no
      # corresponden a la versión que se despliega.
      - uses: actions/setup-dotnet@v6
        if: always()
        with:
          dotnet-version: "8.0.x"

      # `dotnet list package --vulnerable` opera sobre un proyecto, y los dos
      # proyectos del repo no son equivalentes: CoopagcuyApi.csproj es lo que
      # se despliega, así que sus vulnerabilidades sí bloquean en Pull
      # Request. Mismo criterio que se aplicará en el front con
      # `pnpm audit --prod`: se bloquea por lo que se sirve, no por las
      # herramientas de desarrollo.
      #
      # `if` explícito y no `[ ... ] && exit 1`: el shell de Actions corre
      # con `bash -e` y una comparación falsa en una lista `&&` es una fuente
      # clásica de gates que fallan (o no) por accidente.
      #
      # `if: always()` por la misma razón que los pasos de Trivy de más
      # arriba: este paso también bloquea en Pull Request, así que su
      # veredicto tiene que emitirse aunque un Trivy anterior haya fallado.
      - name: Auditoría de paquetes NuGet (API)
        if: always()
        run: |
          dotnet restore CoopagcuyApi.csproj -p:RestoreLockedMode=true
          salida=$(dotnet list CoopagcuyApi.csproj package --vulnerable --include-transitive)
          echo "$salida"
          {
            echo '### Paquetes NuGet vulnerables — API (CoopagcuyApi.csproj)'
            echo '```'
            echo "$salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$salida" | grep -q "has the following vulnerable packages"; then
            echo "Se encontraron paquetes vulnerables en la API."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              exit 1
            fi
          fi

      # tests/CoopagcuyApi.Tests.csproj nunca llega a producción: se audita
      # igual (para tener visibilidad de su árbol de dependencias), pero el
      # resultado es puramente informativo y nunca bloquea. `if: always()`
      # para que el resumen se publique aunque el paso anterior haya fallado.
      - name: Auditoría de paquetes NuGet (pruebas, informativo)
        if: always()
        run: |
          dotnet restore tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -p:RestoreLockedMode=true
          salida=$(dotnet list tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj package --vulnerable --include-transitive)
          echo "$salida"
          {
            echo '### Paquetes NuGet vulnerables — pruebas (informativo, no bloquea)'
            echo '```'
            echo "$salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
