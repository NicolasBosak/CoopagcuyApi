name: Desplegar API

# develop -> staging (automático); main -> producción (con aprobación).
# Los Pull Requests solo compilan (job build-test), no despliegan.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Evita que dos despliegues de la misma rama se pisen entre sí
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Compilación y verificación ───────────────────────────────────
  build-test:
    runs-on: ubuntu-latest

    # Mismo Postgres que docker-compose.tests.yml, publicado en 5433 para que
    # la cadena por defecto del código de pruebas también sirva aquí.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coopagcuy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coopagcuy_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Se apunta al csproj de pruebas y no a CoopagcuyApi.slnx: el formato
      # .slnx solo lo entiende el SDK 9.0.200+ y aquí corre el SDK 8 (igual
      # que en docker-compose.tests.yml). La referencia de proyecto arrastra
      # al API, así que también queda compilado.
      - run: dotnet restore tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj
      - run: dotnet build tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -c Release --no-restore

      - name: Pruebas
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5433;Database=coopagcuy_test;Username=postgres;Password=postgres"
        run: >-
          dotnet test tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --results-directory artefactos

      # Se suben también cuando fallan: es justo cuando hacen falta
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: artefactos/

  # ── 2. Migraciones + despliegue (solo en push a develop/main) ────────
  deploy:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push de la imagen a ghcr.io
      id-token: write    # login a Azure vía OIDC (sin secreto de larga vida)
    # El nombre del entorno decide el gate: production exige aprobación
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige el nombre del repositorio en minúsculas
      - name: Calcular nombre de imagen
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── 2a. Imagen Docker -> ghcr.io, etiquetada con el SHA ──────────
      - name: Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Se construye SIN publicar para poder escanear antes de exponerla
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Escaneo de la imagen ya construida (distinto del escaneo de
      # filesystem/secretos/config de seguridad.yml, que corre sobre el
      # código fuente y no ve capas ni paquetes del sistema instalados).
      - name: Trivy sobre la imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Sin esto, una CVE de Debian sin parche disponible dejaría al
          # proyecto sin poder desplegar ni siquiera un hotfix
          ignore-unfixed: true
          format: table
          # Este job solo corre en push (ver el "if" del job), así que en la
          # práctica siempre evalúa a '0': el gate real ocurriría si algún
          # día este job también corriera en pull_request.
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      # Se etiqueta y publica recién aquí, después de que el escaneo dio luz
      # verde: es la misma imagen cargada arriba (mismo tag de SHA), no una
      # reconstrucción.
      - name: Publicar imagen
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}

      # ── 2b. Migraciones EF contra la rama Neon del entorno ───────────
      # Corren ANTES de publicar la app: si una migración falla, el
      # despliegue se detiene y la versión vieja sigue intacta.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Aplicar migraciones
        env:
          ConnectionStrings__NeonDb: ${{ secrets.NEON_CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project CoopagcuyApi.csproj

      # ── 2c. Actualizar la imagen del Container App ───────────────────
      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar nueva revisión
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINERAPP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE }}:${{ github.sha }}

      # ── 2d. Smoke test: la nueva revisión responde /health ───────────
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.API_URL }}/health" || true)
            if [ "$code" = "200" ]; then echo "Health OK"; exit 0; fi
            echo "intento $i -> $code"; sleep 10
          done
          echo "El endpoint /health no respondió 200 tras el despliegue"; exit 1
