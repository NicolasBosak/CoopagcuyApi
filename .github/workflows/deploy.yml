name: Desplegar API

# main -> producción (con aprobación manual del entorno "production").
# develop solo ejecuta la verificación (build-test); ya no despliega: el
# entorno de staging se eliminó de Azure para reducir costes.
# Los Pull Requests compilan (job build-test) y escanean la imagen Docker
# (job scan-image-pr, que sí bloquea el merge ante HIGH/CRITICAL parcheable);
# no despliegan.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Evita que dos despliegues de la misma rama se pisen entre sí
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Compilación y verificación ───────────────────────────────────
  build-test:
    runs-on: ubuntu-latest

    # Mismo Postgres que docker-compose.tests.yml, publicado en 5433 para que
    # la cadena por defecto del código de pruebas también sirva aquí.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coopagcuy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coopagcuy_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Se apunta al csproj de pruebas y no a CoopagcuyApi.slnx: el formato
      # .slnx solo lo entiende el SDK 9.0.200+ y aquí corre el SDK 8 (igual
      # que en docker-compose.tests.yml). La referencia de proyecto arrastra
      # al API, así que también queda compilado.
      - run: dotnet restore tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -p:RestoreLockedMode=true
      - run: dotnet build tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -c Release --no-restore

      - name: Pruebas
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5433;Database=coopagcuy_test;Username=postgres;Password=postgres"
        run: >-
          dotnet test tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --results-directory artefactos

      # Se suben también cuando fallan: es justo cuando hacen falta
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: artefactos/

  # ── 1b. Escaneo de la imagen en Pull Request (bloqueante) ────────────
  # Independiente de build-test a propósito: build-test valida el código con
  # dotnet test, este job valida la imagen Docker ya armada (capas del SO +
  # runtime publicado), son verificaciones distintas que no comparten pasos.
  # Correrlos en paralelo (sin "needs") da retroalimentación más rápida en el
  # PR y evita complicar el grafo de dependencias solo para ahorrar un build
  # de imagen que de por sí ya es rápido.
  #
  # Este es el único punto del workflow donde el escaneo Trivy de la imagen
  # bloquea de verdad: el mismo paso dentro de "deploy" solo corre en push y
  # ahí es informativo (ver el comentario en ese job).
  scan-image-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # no publica nada, no necesita login a ghcr.io
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige el nombre del repositorio en minúsculas; aquí solo se
      # usa como tag local para la imagen que se escanea, nunca se publica.
      - name: Calcular nombre de imagen
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Se construye SIN publicar: este job nunca hace login ni push a ghcr.io
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy sobre la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Sin esto, una CVE de Debian sin parche disponible dejaría al
          # proyecto sin poder mergear ni siquiera un hotfix
          ignore-unfixed: true
          format: table
          # Aquí sí bloquea: en PR es donde la política del plan exige
          # detener el merge ante un HIGH/CRITICAL parcheable.
          exit-code: "1"

  # ── 2. Migraciones + despliegue (solo en push a main) ────────────────
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push de la imagen a ghcr.io
      id-token: write    # login a Azure vía OIDC (sin secreto de larga vida)
    # Único entorno: production, con la aprobación manual ya configurada
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      # ── 2a. Comprobación previa de la configuración del entorno ──────
      # Va PRIMERO por una razón concreta: sin esto, un secreto ausente no se
      # descubre hasta el paso que lo usa, y para entonces el despliegue ya
      # publicó la imagen y aplicó las migraciones. Eso deja la base de datos
      # de producción con el esquema nuevo mientras la aplicación sigue
      # sirviendo el código viejo. Pasó de verdad: faltaban AZURE_CLIENT_ID y
      # AZURE_TENANT_ID, y el fallo llegó tras migrar la base.
      #
      # Solo se comprueba que no estén vacíos; nunca se imprime su valor.
      - name: Comprobar configuración del entorno
        id: config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          API_URL: ${{ vars.API_URL }}
        run: |
          # ── Imprescindibles: sin esto no se puede ni construir ni migrar ──
          faltan=""
          for nombre in NEON_CONNECTION_STRING JWT_KEY \
                        CONTAINERAPP_NAME RESOURCE_GROUP API_URL; do
            if [ -z "${!nombre:-}" ]; then
              faltan="$faltan $nombre"
            fi
          done

          if [ -n "$faltan" ]; then
            echo "::error::Faltan en el entorno 'production':$faltan"
            echo "Configúralos en Settings > Environments > production."
            exit 1
          fi

          # ── Azure: OPCIONAL, a propósito ─────────────────────────────
          # Crear la identidad OIDC exige el rol "Application Developer" en el
          # directorio, y las cuentas de Azure for Students suelen tenerlo
          # denegado por política del tenant ("Insufficient privileges to
          # complete the operation" al hacer `az ad app create`).
          #
          # Sin esas credenciales el pipeline igual construye, escanea,
          # publica la imagen y aplica las migraciones; solo queda pendiente
          # el último paso, que el operador ejecuta a mano con su propia
          # sesión de az (tener permisos sobre la SUSCRIPCIÓN es suficiente
          # para eso, aunque no se tengan sobre el DIRECTORIO).
          #
          # El día que existan los tres secretos, este mismo workflow pasa a
          # desplegar solo, sin tocar una línea.
          azure_faltan=""
          n_faltan=0
          n_total=0
          for nombre in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            n_total=$((n_total + 1))
            if [ -z "${!nombre:-}" ]; then
              azure_faltan="$azure_faltan $nombre"
              n_faltan=$((n_faltan + 1))
            fi
          done

          if [ "$n_faltan" -eq 0 ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
            echo "Credenciales de Azure presentes: el despliegue se completa automáticamente."
          elif [ "$n_faltan" -eq "$n_total" ]; then
            echo "azure=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin credenciales de Azure: el despliegue final queda pendiente (ver el resumen del job)."
          else
            # Estar a medias es un error de configuración, no el modo manual:
            # azure/login fallaría a mitad del despliegue, que es justo lo
            # que esta comprobación existe para evitar.
            echo "::error::Configuración de Azure incompleta, faltan:$azure_faltan"
            echo "Deben estar los tres secretos o ninguno."
            exit 1
          fi

      # ── 2b. Login a Azure ────────────────────────────────────────────
      # Antes de construir y de migrar, no después: autenticar es barato y
      # falla en segundos, así que si la identidad OIDC está mal configurada
      # conviene saberlo antes de tocar el registro de imágenes y la base de
      # datos. El token dura de sobra para el resto del job.
      - name: Login a Azure
        if: steps.config.outputs.azure == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ghcr.io exige el nombre del repositorio en minúsculas
      - name: Calcular nombre de imagen
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # ── 2a. Imagen Docker -> ghcr.io, etiquetada con el SHA ──────────
      - name: Login a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Se construye SIN publicar para poder escanear antes de exponerla
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Escaneo de la imagen ya construida (distinto del escaneo de
      # filesystem/secretos/config de seguridad.yml, que corre sobre el
      # código fuente y no ve capas ni paquetes del sistema instalados).
      #
      # Es puramente INFORMATIVO: no bloquea. El "deploy" solo corre en push
      # (ver el "if" del job), nunca en pull_request, así que bloquear aquí
      # detendría un despliegue ya aprobado y en curso, no un merge. El gate
      # que sí bloquea vive en el job "scan-image-pr", que corre en el PR
      # antes de que el código llegue a esta rama.
      - name: Trivy sobre la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Sin esto, una CVE de Debian sin parche disponible dejaría al
          # proyecto sin poder desplegar ni siquiera un hotfix
          ignore-unfixed: true
          format: table
          exit-code: "0"

      # Se etiqueta y publica recién aquí, después de que el escaneo dio luz
      # verde: es la misma imagen cargada arriba (mismo tag de SHA), no una
      # reconstrucción.
      - name: Publicar imagen
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:${{ github.ref_name }}

      # ── 2e. Migraciones EF contra la rama Neon de producción ─────────
      # Corren ANTES de actualizar el Container App: si una migración falla,
      # el despliegue se detiene y la revisión vieja sigue sirviendo.
      #
      # Y corren DESPUÉS del login a Azure (paso 2b) a propósito: migrar deja
      # la base con el esquema nuevo, así que cualquier cosa que pueda fallar
      # de forma barata —autenticación, configuración— debe haberse verificado
      # ya. Si no, un fallo posterior deja la base por delante del código.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Aplicar migraciones
        env:
          ConnectionStrings__NeonDb: ${{ secrets.NEON_CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
        # Se reintenta porque Neon es serverless: si el cómputo lleva rato
        # suspendido, la primera conexión puede agotar el tiempo de espera
        # mientras la instancia arranca. `AppDbContextFactory` ya reintenta a
        # nivel de EF, pero ese reintento no cubre todo el camino de apertura
        # de la conexión, así que este bucle es la red de seguridad: basta con
        # que un intento despierte la base para que el siguiente funcione.
        #
        # Reintentar migraciones es seguro: EF aplica solo las pendientes y
        # registra cada una en __EFMigrationsHistory dentro de su transacción,
        # así que un intento fallido no deja nada a medias.
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          export PATH="$PATH:$HOME/.dotnet/tools"

          for intento in 1 2 3; do
            if dotnet ef database update --project CoopagcuyApi.csproj; then
              echo "Migraciones aplicadas (intento $intento)."
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "::warning::Intento $intento fallido. Si Neon estaba suspendido, este intento lo habrá despertado; reintentando en 20 s."
              sleep 20
            fi
          done

          echo "::error::Las migraciones fallaron en los 3 intentos. Revisa el error de arriba: si no es un tiempo de espera, el problema no es el arranque en frío de Neon."
          exit 1

      # ── 2f. Actualizar la imagen del Container App ───────────────────
      - name: Desplegar nueva revisión
        if: steps.config.outputs.azure == 'true'
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINERAPP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE }}:${{ github.sha }}

      # ── 2g. Smoke test: la nueva revisión responde /health ───────────
      - name: Smoke test
        if: steps.config.outputs.azure == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.API_URL }}/health" || true)
            if [ "$code" = "200" ]; then echo "Health OK"; exit 0; fi
            echo "intento $i -> $code"; sleep 10
          done
          echo "El endpoint /health no respondió 200 tras el despliegue"; exit 1

      # ── 2h. Modo manual: instrucciones para completar el despliegue ──
      # El job termina en VERDE a propósito. Todo lo que este pipeline puede
      # verificar y publicar salió bien; lo que falta es un permiso de
      # directorio que no depende del código. Dejarlo en rojo cada vez
      # normalizaría el rojo, y un check que siempre está rojo deja de leerse.
      # El aviso va al resumen del job para que quede visible, no enterrado
      # en el log de un paso.
      - name: Despliegue pendiente de completar a mano
        if: steps.config.outputs.azure != 'true'
        run: |
          {
            echo "## ⚠️ Despliegue pendiente"
            echo ""
            echo "La imagen se publicó en ghcr.io y las migraciones se aplicaron,"
            echo "pero el Container App **no se actualizó**: faltan las credenciales"
            echo "de Azure en el entorno \`production\`."
            echo ""
            echo "Complétalo desde tu máquina, con la sesión de \`az login\` iniciada:"
            echo ""
            echo '```bash'
            echo "az containerapp update --name ${{ vars.CONTAINERAPP_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} --image ${{ env.IMAGE }}:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Y comprueba que quedó arriba:"
            echo ""
            echo '```bash'
            echo "curl -s -o /dev/null -w '%{http_code}\\n' ${{ vars.API_URL }}/health"
            echo '```'
            echo ""
            echo "### Para que esto pase a ser automático"
            echo ""
            echo "Hace falta el rol **Application Developer** en el directorio de Entra ID."
            echo "Con él, la sección 8 de \`infra/bootstrap.azcli\` crea la identidad OIDC, y"
            echo "basta con añadir \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\` y"
            echo "\`AZURE_SUBSCRIPTION_ID\` al entorno \`production\`. Este workflow los detecta"
            echo "solo: no hay que cambiar nada más."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Imagen publicada y migraciones aplicadas. El despliegue final quedó pendiente: ver el resumen del job."
