# Ejecuta la batería de pruebas dentro de Linux. Necesario porque Smart App
# Control bloquea la carga del DLL recién compilado desde OneDrive (0x800711C7),
# así que `dotnet test` no corre en el Windows del equipo.
#
#   docker compose -f docker-compose.tests.yml run --rm tests
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coopagcuy_test
    ports:
      - "5433:5432"        # 5433 en el host: no choca con un Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coopagcuy_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data   # efímero: la BD de test no debe sobrevivir

  azurite:
    # Emulador oficial de Azure Storage. Se añade porque BlobStorageService
    # lanza si no hay cadena de conexión: sin esto, cualquier prueba que
    # resuelva el servicio por DI falla al construirlo, aunque no suba nada.
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    # No el SDK pelado: Dockerfile.tests le añade las fuentes de texto que
    # QuestPDF necesita. Sin ellas los PDF salen sin una sola letra y las
    # pruebas de la guía verificarían un documento que no se parece al real.
    build:
      context: .
      dockerfile: Dockerfile.tests
    working_dir: /src
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    environment:
      # Nombre de servicio, no localhost: se resuelve en la red del compose
      TEST_DB_CONNECTION: "Host=postgres;Port=5432;Database=coopagcuy_test;Username=postgres;Password=postgres"
      # Cuenta de desarrollo de Azurite: credencial pública y fija del
      # emulador, documentada por Microsoft. No es un secreto.
      TEST_BLOB_CONNECTION: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Los paquetes NuGet se cachean en un volumen para no re-descargar
      NUGET_PACKAGES: /nuget
      # Sin esto el contenedor corre en UTC, donde DateTimeKind.Local es
      # idéntico a DateTimeKind.Utc: la rama Local de FechaUtc.Normalizar
      # quedaría indistinguible de la de Utc y su prueba no podría fallar
      # aunque se rompiera. America/Guayaquil coincide con DesfasePiloto
      # (UTC-5) a propósito, para que las pruebas de esa rama tengan sentido.
      TZ: "America/Guayaquil"
    volumes:
      - .:/src
      - nuget-cache:/nuget
    # Se apunta al csproj de pruebas y no a CoopagcuyApi.slnx: el formato
    # .slnx solo lo entiende el SDK 9.0.200+ y aquí corre el SDK 8 (subirlo
    # no es opción, la imagen sdk:10 no trae el runtime net8.0 que los tests
    # necesitan para ejecutarse). La referencia de proyecto arrastra al API.
    command: dotnet test tests/CoopagcuyApi.Tests/CoopagcuyApi.Tests.csproj --logger "console;verbosity=normal"

volumes:
  nuget-cache:
